spring:
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    cache-names: categoryById, categoryList, productById, productList, variantById, variantList, variantListByProduct
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/inventory_database
    username: inventory_user
    password: inventory_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.sql: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
