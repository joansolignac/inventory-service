services:
  mysql_service:
    image: mysql:8.4
    container_name: inventory_database
    restart: always
    environment:
      MYSQL_DATABASE: inventory_database
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: inventory_user
      MYSQL_PASSWORD: inventory_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    network_mode: bridge
  redis:
    image: redis:7-alpine
    container_name: inventory_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
